<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>BUF FMC 监控大屏 · 模式选择</title>
<link rel="stylesheet" href="css/dashboard.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  body.menu-page {
    display: block;
    overflow: auto;
    background: radial-gradient(1200px 600px at 50% -10%, #0a1526, #04080f 70%);
    padding: 48px 6vw;
  }
  .menu-wrap { max-width: 1100px; margin: 0 auto; }
  .menu-title {
    color: #7fd4ff;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.02em; /* §15 大字号负 tracking */
    line-height: 1.05;       /* §15 大字号紧 leading */
    text-align: center;
    margin-bottom: 8px;
  }
  .menu-sub {
    color: #4a6b8a;
    font-size: 15px;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 22px;
  }
  .menu-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px 24px;
    background: linear-gradient(180deg, #0a1526, #06101c);
    border: 1px solid #14304f;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    /* 加载时轻微 stagger 上浮淡入（§1 即时感；reduced-motion 下关闭） */
    animation: menu-card-in .45s ease both;
  }
  .menu-card:nth-child(1) { animation-delay: 0ms; }
  .menu-card:nth-child(2) { animation-delay: 60ms; }
  .menu-card:nth-child(3) { animation-delay: 120ms; }
  .menu-card:nth-child(4) { animation-delay: 180ms; }
  @keyframes menu-card-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .menu-card:hover {
    border-color: #2f6ea5;
    transform: translateY(-2px);              /* hover 上浮 2px */
    box-shadow: 0 10px 28px rgba(20, 60, 100, .6); /* 阴影加深 */
    will-change: transform;
  }
  /* §1/§10 即时反馈：按下即刻 scale(0.97)，100ms ease-out */
  .menu-card:active {
    transform: scale(0.97);
    transition: transform 100ms ease-out;
  }
  .menu-card .mc-name { color: #7fd4ff; font-size: 21px; font-weight: 700; letter-spacing: 1px; }
  .menu-card .mc-desc { color: #8fb4d4; font-size: 14px; line-height: 1.6; flex: 1 1 auto; }
  .menu-card .mc-url {
    color: #4a6b8a;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  .menu-card .mc-tag {
    align-self: flex-start;
    padding: 1px 8px;
    border: 1px solid #ffd35f;
    border-radius: 3px;
    color: #ffd35f;
    font-size: 12px;
  }
  /* 停留时长选择行（三张非 QA 卡片共享同一持久化偏好 buf.dwell） */
  .mc-dwell-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px dashed #14304f;
  }
  .mc-dwell-lbl { color: #4a6b8a; font-size: 12px; letter-spacing: 1px; }
  .mc-dwell {
    background: rgba(18, 24, 34, 0.9);
    color: #cfe8ff;
    border: 1px solid #14304f;
    border-radius: 4px;
    padding: 3px 10px;
    font: 13px 'Noto Sans SC', 'Roboto Condensed', system-ui, sans-serif;
    cursor: pointer;
  }
  .mc-dwell:hover { border-color: #2f6ea5; }
  .mc-dwell:focus { outline: 1px solid #7fd4ff; }
  /* §14 reduced-motion：关 stagger 与位移，退化为 200ms 内淡入/静态 */
  @media (prefers-reduced-motion: reduce) {
    .menu-card { animation: none; transition: none; }
    .menu-card:hover { transform: none; }
    .menu-card:active { transform: none; }
  }
  /* §14 prefers-contrast:more：卡片加对比边框 */
  @media (prefers-contrast: more) {
    .menu-card { border: 2px solid #9fdcff; }
  }
</style>
</head>
<body class="menu-page">
<div class="menu-wrap">
  <div class="menu-title">BUF FMC 监控大屏</div>
  <div class="menu-sub">选择运行模式</div>
  <div class="menu-grid">
    <a class="menu-card" data-base="index.html" href="index.html">
      <span class="mc-name">正常监控模式</span>
      <span class="mc-desc">默认模式：自动轮播全部页面（每页停留时长可选），使用 mock 数据模拟在厂状态与随机报警。</span>
      <div class="mc-dwell-row">
        <span class="mc-dwell-lbl">停留时长</span>
        <select class="mc-dwell">
          <option value="60" selected>1 分钟</option><option value="30">30 秒</option>
          <option value="15">15 秒</option><option value="5">5 秒</option>
        </select>
      </div>
      <span class="mc-url">index.html</span>
    </a>
    <a class="menu-card" data-base="index.html?alarmRate=1" href="index.html?alarmRate=1">
      <span class="mc-name">报警演示模式</span>
      <span class="mc-desc">高概率触发报警，便于验收报警锁定、包络特写/巡航与底部报警信息条。</span>
      <div class="mc-dwell-row">
        <span class="mc-dwell-lbl">停留时长</span>
        <select class="mc-dwell">
          <option value="60" selected>1 分钟</option><option value="30">30 秒</option>
          <option value="15">15 秒</option><option value="5">5 秒</option>
        </select>
      </div>
      <span class="mc-url">index.html?alarmRate=1</span>
    </a>
    <a class="menu-card" data-base="index.html?alarmRate=1" href="index.html?alarmRate=1">
      <span class="mc-name">快速轮播模式</span>
      <span class="mc-desc">自选较短停留时长（如 15-30 秒）+ 报警演示：换页更频繁，适合快速观察跨页报警切换。</span>
      <div class="mc-dwell-row">
        <span class="mc-dwell-lbl">停留时长</span>
        <select class="mc-dwell">
          <option value="60">1 分钟</option><option value="30" selected>30 秒</option>
          <option value="15">15 秒</option><option value="5">5 秒</option>
        </select>
      </div>
      <span class="mc-url">index.html?alarmRate=1</span>
    </a>
    <a class="menu-card" href="index.html?qa=1">
      <span class="mc-name">质检模式（QA）</span>
      <span class="mc-tag">开发用</span>
      <span class="mc-desc">渲染核验模式：不自动轮播，用于逐页检查渲染正确性。</span>
      <span class="mc-url">index.html?qa=1</span>
    </a>
  </div>
</div>
<script>
(function () {
  /* 三张非 QA 卡片共享一个停留时长偏好（与监控页同 key：buf.dwell）：
   * 选择即持久化并同步全部卡片；点击卡片把所选时长以 ?dwell= 带入监控页。
   * 监控页无 URL 参数时读同一 key。 */
  var KEY = 'buf.dwell';
  var OPTS = [60, 30, 15, 5]; // 秒，与监控页胶囊一致
  var selEls = document.querySelectorAll('.mc-dwell');
  var cards = document.querySelectorAll('.menu-card[data-base]');
  function storedMs() {
    var v = null;
    try { v = localStorage.getItem(KEY); } catch (e) {}
    return v != null && isFinite(+v) && +v > 0 ? +v : 60000; // 非法/未存：默认 1 分钟
  }
  function nearestSec(ms) { // 存量值可能来自 URL 钳制（非整选项），取最接近选项
    var best = 60, bd = Infinity;
    for (var i = 0; i < OPTS.length; i++) {
      var d = Math.abs(OPTS[i] * 1000 - ms);
      if (d < bd) { bd = d; best = OPTS[i]; }
    }
    return best;
  }
  function renderDwell(sec) {
    for (var i = 0; i < selEls.length; i++) {
      if (selEls[i].querySelector('option[value="' + sec + '"]')) selEls[i].value = String(sec);
    }
    for (var j = 0; j < cards.length; j++) {
      var base = cards[j].getAttribute('data-base');
      cards[j].setAttribute('href',
        base + (base.indexOf('?') >= 0 ? '&' : '?') + 'dwell=' + sec * 1000);
      var u = cards[j].querySelector('.mc-url');
      if (u) u.textContent = cards[j].getAttribute('href');
    }
  }
  /* 选择行拦截点击，避免冒泡触发卡片跳转 */
  var rows = document.querySelectorAll('.mc-dwell-row');
  for (var r = 0; r < rows.length; r++) {
    rows[r].addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); });
  }
  for (var s = 0; s < selEls.length; s++) {
    selEls[s].addEventListener('change', function () {
      var sec = +this.value;
      renderDwell(sec);
      try { localStorage.setItem(KEY, String(sec * 1000)); } catch (e) {}
    });
  }
  renderDwell(nearestSec(storedMs())); // 初始：共享监控页持久化值，默认 1 分钟
})();
</script>
</body>
</html>
