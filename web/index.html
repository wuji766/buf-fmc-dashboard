<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>BUF FMC 监控大屏</title>
<link rel="stylesheet" href="css/dashboard.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<header id="hud">
  <span id="pageName">—</span>
  <span id="clock"></span>
  <span id="zoomHint">滚轮缩放 · 拖拽平移 · 双击复位</span>
  <span id="srcState" class="ok">模拟数据</span>
</header>
<div id="statusBar">
  <span id="lotSummary">在厂 Lot 0 · 正常 0 / 预告 0 / 满杯 0 / 报警 0 · 活跃报警 0</span>
  <span id="carouselState">自动轮播</span>
</div>
<main id="stage"><svg id="board" preserveAspectRatio="xMidYMid meet"></svg></main>
<footer id="legend">
  <span class="lg"><i class="sw sw-normal"></i>正常</span>
  <span class="lg"><i class="sw sw-pre"></i>满杯预告</span>
  <span class="lg"><i class="sw sw-full"></i>满杯警告</span>
  <span class="lg"><i class="sw sw-alarm"></i>报警</span>
  <span class="lg"><i class="sw sw-lot">12</i>Lot 在站</span>
</footer>
<footer id="alarmBar" class="hidden"></footer>
<nav id="pager"></nav>
<script src="config.js"></script>
<script src="data/page-1.js"></script><script src="data/page-2.js"></script>
<script src="data/page-3.js"></script><script src="data/page-4.js"></script>
<script src="js/page-render.js"></script>
<script src="js/carousel.js"></script>
<script src="js/alarm.js"></script>
<script src="js/data-provider.js"></script>
<script src="js/mock-provider.js"></script>
<script src="js/zoom.js"></script>
<script src="js/main.js"></script>
</body>
</html>
